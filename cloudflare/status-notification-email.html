<!DOCTYPE html>
<html lang="en" style="box-sizing: border-box;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect status update</title>
    <link rel="stylesheet" href="feedback-thank-you.css">
<style>
@media only screen and (max-width: 600px) {
  .avatar {
    display: none;
  }

  .sales .text {
    max-width: 100% !important;
  }
}
</style></head>
<body style="box-sizing: border-box; margin: 0; padding: 0; background-color: #ececec; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased;">
    <div class="wrapper" style="box-sizing: border-box; max-width: 600px; margin: 0 auto; background-color: #ffffff;">

        <!-- HEADER -->
        <div class="header" style="box-sizing: border-box; display: flex; justify-content: flex-start; align-items: center; padding: 10px 20px; background-color: #ebe8e6;">
            <div class="logo" style="box-sizing: border-box; display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: #111111; letter-spacing: -0.5px; margin-right: auto;">
                <img src="https://www.belora-connect.com/assets/icons/icon-blue.png" alt="Connect" width="40" height="40" style="box-sizing: border-box; width: 40px; height: 40px; display: block;">
            </div>
            <a href="https://www.belora-connect.com/login" class="login-btn" style="box-sizing: border-box; font-size: 14px; color: #3f51b5; text-decoration: none; border: 1px solid #3f51b5; padding: 8px 20px;">LOGIN</a>
        </div>

        <!-- HERO -->
        <div class="hero" style="box-sizing: border-box; padding: 48px 20px 36px; background: __STATUS_HERO_GRADIENT__;">
            <h1 style="box-sizing: border-box; margin: 0 0 16px; font-size: 30px; line-height: 1.2; color: #111111;">Connect status update</h1>
            <p style="box-sizing: border-box; margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #333333;">__STATUS_INTRO__</p>

            <!-- FEEDBACK RECAP -->
            <div class="feedback-box" style="box-sizing: border-box; background-color: #f5f6fb; border-left: 3px solid #3f51b5; padding: 16px 20px; margin: 0 0 28px;">
                <div class="feedback-label" style="box-sizing: border-box; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #3f51b5; margin-bottom: 8px;">__STATUS_LABEL__</div>
                <p class="feedback-text" style="box-sizing: border-box; font-style: italic; margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #333333;">"__STATUS_DETAIL__"</p>
            </div>

            <p style="box-sizing: border-box; margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #333333;">__STATUS_MESSAGE__</p>

            <div class="btn-row" style="box-sizing: border-box; margin: 0;">
                <a href="__STATUS_URL__" class="btn-primary" style="box-sizing: border-box; display: inline-block; padding: 12px 22px; font-size: 14px; font-weight: bold; border-radius: 0; text-decoration: none; background-color: #3f51b5; color: #ffffff; margin-right: 10px;">View Connect Status</a>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer" style="box-sizing: border-box; background-color: #e6e5e1; color: #8a8a85; padding: 40px 32px 36px; text-align: center;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" class="social-table" style="box-sizing: border-box; margin: 0 auto 10px;">
                <tr style="box-sizing: border-box;">
                    <td class="icon-cell" style="box-sizing: border-box; padding: 0 5px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="icon-btn" width="40" height="40" style="box-sizing: border-box; width: 40px; height: 40px; border: 1.5px solid #3a3a37; border-radius: 10px;">
                            <tr style="box-sizing: border-box;"><td align="center" valign="middle" style="box-sizing: border-box;"><a href="https://github.com/beloralabs-connect?tab=repositories" style="box-sizing: border-box;"><img src="https://www.belora-connect.com/assets/icons/github.png" width="16" height="16" alt="GitHub" class="icon-img" style="box-sizing: border-box; filter: invert(1) grayscale(1) brightness(0.2); display: block;"></a></td></tr>
                        </table>
                    </td>
                    <td class="icon-cell" style="box-sizing: border-box; padding: 0 5px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="icon-btn" width="40" height="40" style="box-sizing: border-box; width: 40px; height: 40px; border: 1.5px solid #3a3a37; border-radius: 10px;">
                            <tr style="box-sizing: border-box;"><td align="center" valign="middle" style="box-sizing: border-box;"><a href="https://www.youtube.com/@BeLoraCONNECT" style="box-sizing: border-box;"><img src="https://www.belora-connect.com/assets/icons/youtube.png" width="16" height="16" alt="YouTube" class="icon-img" style="box-sizing: border-box; filter: invert(1) grayscale(1) brightness(0.2); display: block;"></a></td></tr>
                        </table>
                    </td>
                    <td class="icon-cell" style="box-sizing: border-box; padding: 0 5px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="icon-btn" width="40" height="40" style="box-sizing: border-box; width: 40px; height: 40px; border: 1.5px solid #3a3a37; border-radius: 10px;">
                            <tr style="box-sizing: border-box;"><td align="center" valign="middle" style="box-sizing: border-box;"><a href="https://www.linkedin.com/company/belora-labs/" style="box-sizing: border-box;"><img src="https://www.belora-connect.com/assets/icons/linkedin.png" width="16" height="16" alt="LinkedIn" class="icon-img" style="box-sizing: border-box; filter: invert(1) grayscale(1) brightness(0.2); display: block;"></a></td></tr>
                        </table>
                    </td>
                </tr>
            </table>

            <div class="footer-links" style="box-sizing: border-box; font-size: 13px; margin-bottom: 10px;">
                <a href="https://status.belora-connect.com" style="box-sizing: border-box; text-decoration: underline; color: #3a3a37; margin: 0 4px;">Manage status subscriptions</a> ·
                <a href="https://www.belora-connect.com/privacy" style="box-sizing: border-box; text-decoration: underline; color: #3a3a37; margin: 0 4px;">Privacy policy</a>
            </div>

            <div class="footer-note" style="box-sizing: border-box; font-size: 13px; color: #8a8a85; line-height: 1.6; margin-bottom: 20px;">
                © 2026 Belora Labs, Inc. All rights reserved.<br style="box-sizing: border-box;">
                201 Parkwood Dr, Lansing, MI 48917, United States
            </div>

            <div class="footer-logo" style="box-sizing: border-box; display: flex; align-items: center; margin: 0 auto; font-size: 20px; font-weight: 800; color: #1a1a18; width: max-content;">
                <img src="https://www.belora-connect.com/assets/icons/icon-blue.png" alt="Connect" width="30" height="30" style="box-sizing: border-box; display: block; width: 30px; height: 30px; margin-right: 5px;">
                <span class="footer-logo-text" style="box-sizing: border-box; color: #3f51b5;">CONNECT</span>
            </div>
        </div>

    </div>
</body>
</html>
