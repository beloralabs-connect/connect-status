name: translation-monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: translation-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run robot over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null ~/id_ed25519
          echo "$SSH_KEY" > ~/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/known_hosts
          ssh -F /dev/null -i ~/id_ed25519 \
            -o UserKnownHostsFile=$HOME/known_hosts \
            -o StrictHostKeyChecking=yes \
            caleb@5.78.157.160 \
            'cd ~/monitoring && \
             ENV=prod \
             PROD_API_URL=https://api.belora-connect.com \
             ~/api/venv/bin/python ./translation_robot.py'
