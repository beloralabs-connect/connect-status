name: translation-monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: translation-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Run robot over SSH
        id: robot
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$HOME/id_ed25519"
          printf '%s\n' "$SSH_KEY" > "$HOME/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/known_hosts"
          set +e
          ssh -F /dev/null -i "$HOME/id_ed25519" \
            -o UserKnownHostsFile="$HOME/known_hosts" \
            -o StrictHostKeyChecking=yes \
            caleb@5.78.157.160 \
            'cd ~/monitoring && \
            ENV=prod \
            PROD_API_URL=https://api.belora-connect.com \
            ~/api/venv/bin/python ./translation_robot.py' 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          lat=$(grep -oP 'latency=\K[0-9.]+(?=s)' out.txt | head -1)
          echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "latency=${lat:-null}" >> "$GITHUB_OUTPUT"

      - name: Report to Cloudflare Worker
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
          OK: ${{ steps.robot.outputs.ok || 'false' }}
          LATENCY: ${{ steps.robot.outputs.latency || 'null' }}
        run: |
          jq -n --argjson ok "$OK" --argjson latency "$LATENCY" \
            '{ok: $ok, latency: $latency}' |
          curl -fsS -X POST "$REPORT_URL" \
            -H "Authorization: Bearer $REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: gh-monitor/1.0" \
            --data-binary @-

      - name: Fail the job if the robot failed
        if: steps.robot.outputs.ok != 'true'
        run: exit 1
