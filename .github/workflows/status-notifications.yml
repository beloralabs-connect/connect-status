name: Status notifications

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Detect status or maintenance change and notify subscribers
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          NOTIFY_URL: https://connect-status-github.belora-connect.workers.dev/notify
          STATUS_NOTIFY_SECRET: ${{ secrets.STATUS_NOTIFY_SECRET }}
        shell: bash
        run: |
          node <<'NODE'
          const event = JSON.parse(process.env.EVENT_JSON);
          const eventName = process.env.EVENT_NAME || "";
          const issue = event.issue || {};
          const source = event.comment?.body || issue.body || "";
          const previous = event.changes?.body?.from || "";
          const labels = (issue.labels || []).map((label) =>
            String(label.name || "").toLowerCase()
          );
          const isMaintenance = labels.includes("maintenance");
          const statusPattern = /Status\s*:\s*(Service unavailable|Down|Degraded|Operational|Resolved|Investigating|Identified|Resolving)/i;
          const currentMatch = source.match(statusPattern);
          const previousMatch = previous.match(statusPattern);

          let status = "";
          let detail = "";

          if (currentMatch) {
            if (previousMatch &&
                previousMatch[1].toLowerCase() === currentMatch[1].toLowerCase()) {
              console.log("Status value did not change.");
              process.exit(0);
            }

            const statusNames = {
              "service unavailable": "Service unavailable",
              "down": "Down",
              "degraded": "Degraded",
              "operational": "Operational",
              "resolved": "Resolved",
              "investigating": "Investigating",
              "identified": "Identified",
              "resolving": "Resolving"
            };
            status = statusNames[currentMatch[1].toLowerCase()];
            detail = source
              .replace(statusPattern, "")
              .replace(/^\s+|\s+$/g, "")
              .replace(/\n{3,}/g, "\n\n") ||
              "A status update was published.";
          } else if (
            isMaintenance &&
            eventName === "issues" &&
            (event.action === "opened" || event.action === "edited")
          ) {
            const bodyChanged = event.action === "opened" ||
              Boolean(event.changes?.body) ||
              Boolean(event.changes?.title);
            if (!bodyChanged) {
              console.log("Maintenance fields did not change.");
              process.exit(0);
            }

            status = "Maintenance";
            detail = (issue.body || "A planned maintenance window was published.")
              .replace(/<!--([\s\S]*?)-->/g, "")
              .replace(/[#*_]/g, "")
              .replace(/\n{3,}/g, "\n\n")
              .trim()
              .slice(0, 1200);
          } else {
            console.log("No status or maintenance change in this event.");
            process.exit(0);
          }

          const eventId = String(
            event.comment?.id ||
            (issue.id + "-" + (process.env.GITHUB_SHA || "issue"))
          );

          fetch(process.env.NOTIFY_URL, {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + process.env.STATUS_NOTIFY_SECRET,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              eventId,
              status,
              title: issue.title || "Connect",
              detail,
              issueUrl: issue.html_url || "https://status.belora-connect.com"
            })
          }).then(async (response) => {
            const body = await response.text();
            console.log(body);
            if (!response.ok) process.exit(1);
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
